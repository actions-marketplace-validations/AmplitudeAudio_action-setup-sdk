name: 'Setup Amplitude Audio SDK'
description:
  'GitHub Action that set up Amplitude Audio SDK and make it available in your
  pipelines.'
author: 'Sparky Studios'

branding:
  icon: 'package'
  color: 'red'

inputs:
  platforms:
    description:
      'The list of SDK platforms to install. Use exact CI identifiers:
      x64-windows, x86_64-linux, x86_64-linux-clang, x86_64-macosx,
      arm64-macosx, x86_64-android, arm64-v8a-android, x86-android,
      armeabi-v7a-android, arm64-iphoneos, x86_64-iphoneos'
    required: true
  version:
    description:
      'The version of the SDK to install. Use "nightly" for latest develop
      builds, or a release tag like "v1.0.0".'
    required: true
    default: 'nightly'
  install-dir:
    description: 'The directory where to install the SDK'
    required: false
    default: './amplitude_audio'
  config:
    description: 'The build configuration to download. Either debug or release.'
    required: true
    default: 'debug'

outputs:
  path:
    description: 'The path where the SDK has been installed'

runs:
  using: node24
  main: dist/index.js
